<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-5">
    <div class="text-center p-5 card-custom animate-fade-in w-100" style="max-width: 600px;">
        <div class="mb-4">
            <i class="bi bi-building-check fs-1 text-primary"></i> 
        </div>
        <h1 class="fw-bold mb-3 display-5">Hotel Reservation Portal</h1>
        <p class="text-muted mb-5">Gerencie suas reservas de forma simples e rápida.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-custom-primary" [routerLink]="['/new']">
                <i class="bi bi-plus-lg me-2"></i> Nova Reserva
            </button>
            <button class="btn btn-outline-secondary btn-lg" [routerLink]="['/list']">
                <i class="bi bi-list-ul me-2"></i> Ver Lista
            </button>
        </div>
    </div>
</div>
